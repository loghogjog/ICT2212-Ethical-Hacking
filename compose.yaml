services:
  # Config for Web Application
  web:
    container_name: helpdesk
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USER_UID=${UID:-1002}
        - USER_GID=${GID:-1002}
    user: "${UID:-1002}:${GID:-1002}"
    ports:
      - "443:8443"
    volumes:
      - db_data:/var/www/db
    pid: "host"
    cap_drop:
      - ALL
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/db/database.sqlite
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}

volumes:
  db_data:
